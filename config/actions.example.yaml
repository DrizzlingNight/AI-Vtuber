    neutral_value: 0.0
    duration_seconds: 20.0
    fps: 30
    weight: 1.0
  talk_eye_left:
    kind: parameter
    target: replace-with-left-eye-open-input
    peak_value: 0.0
    neutral_value: 1.0
    duration_seconds: 20.0
    fps: 30
    weight: 1.0
  talk_eye_right:
    kind: parameter
    target: replace-with-right-eye-open-input
    peak_value: 0.0
    neutral_value: 1.0
    duration_seconds: 20.0
    fps: 30
    weight: 1.0
  talk_brows:
    kind: parameter
    target: replace-with-brows-input
    peak_value: 0.35
    neutral_value: 0.0
    duration_seconds: 20.0
    fps: 30
    weight: 1.0
smoke:
  expression: expression_test
  hotkey: hotkey_test
  continuous: continuous_test
